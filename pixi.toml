[workspace]
authors = ["Fredrick Eisele <fred.eisele@vanderbilt.edu>"]
channels = ["https://prefix.dev/meso-forge", "conda-forge"]
name = "tinkercat"
platforms = ["linux-64"]
version = "0.1.1"

# ── Build ────────────────────────────────────────────────────────────────────

[tasks.gradle-tasks]
cmd = "gradle tasks"
description = "List all available Gradle tasks"

[tasks.gradle]
cmd = "gradle"
description = "Run an arbitrary Gradle task (pass the task name as an argument)"

[tasks.build]
cmd = "gradle build"
description = "Compile all Kotlin targets and run the full test suite"

[tasks.compile-all]
cmd = "gradle compileKotlinJvm compileKotlinJs compileKotlinNative"
description = "Compile all Kotlin targets (JVM, JS, Native) without running tests"

[tasks.compile]
cmd = "gradle compileKotlinJvm"
description = "Compile the JVM target only"

[tasks.clean]
cmd = "gradle clean"
description = "Delete all Gradle build outputs and generated files"

# ── Test ─────────────────────────────────────────────────────────────────────

[tasks.test]
cmd = "gradle allTests"
description = "Run all test suites across JVM, JS, and Native targets"

[tasks.test-safe]
cmd = "gradle allTests || (echo 'Tests failed - checking what compiles...' && gradle compileKotlinJvm && echo 'JVM code compiles successfully' && gradle compileKotlinJs && echo 'JS code compiles successfully' && gradle compileKotlinNative && echo 'Native code compiles successfully')"
description = "Run all tests; fall back to per-target compilation check on failure"

[tasks.test-compile-check]
cmd = "echo 'Checking compilation...' && gradle compileKotlinJvm && echo '✅ JVM compiles' && gradle compileKotlinJs && echo '✅ JS compiles' && gradle compileKotlinNative && echo '✅ Native compiles' && echo 'All main code compiles successfully'"
description = "Verify that all main source targets compile without running tests"

[tasks.test-code-check]
cmd = "echo 'Checking test compilation (may show errors)...' && (gradle compileTestKotlinJvm && echo '✅ JVM tests compile' || echo '❌ JVM test compilation failed') && (gradle compileTestKotlinJs && echo '✅ JS tests compile' || echo '❌ JS test compilation failed') && (gradle compileTestKotlinNative && echo '✅ Native tests compile' || echo '❌ Native test compilation failed')"
description = "Verify that test source code compiles for all targets"

[tasks.test-jvm]
cmd = "gradle jvmTest"
description = "Run JVM tests only"

[tasks.test-js]
cmd = "gradle jsTest"
description = "Run all JavaScript tests (browser and Node.js)"

[tasks.test-native]
cmd = "gradle nativeTest"
description = "Run Kotlin/Native tests only"

[tasks.test-js-browser]
cmd = "gradle jsBrowserTest"
description = "Run JavaScript tests in a headless browser"

[tasks.test-js-node]
cmd = "gradle jsNodeTest"
description = "Run JavaScript tests under Node.js"

[tasks.test-npm]
cmd = "gradle compileProductionExecutableKotlinJs && cd tests/npm && npm install && npm test"
description = "Run TypeScript tests in tests/npm/ against the compiled Kotlin/JS output"

[tasks.test-npm-install]
cmd = "cd tests/npm && npm install"
description = "Install npm devDependencies for tests/npm/ (vitest, typescript)"

[tasks.test-help]
cmd = "echo 'Available test commands:' && echo '  pixi run test               - All Kotlin tests (JVM + JS + Native)' && echo '  pixi run test-jvm           - JVM tests only' && echo '  pixi run test-js            - JavaScript tests (browser + Node.js)' && echo '  pixi run test-native        - Kotlin/Native tests only (includes tests/kotlin/)' && echo '  pixi run test-python        - Python test suite (tests/python/)' && echo '  pixi run test-python-pkg    - Python package integration tests (python/tests/)' && echo '  pixi run test-npm           - TypeScript tests in tests/npm/ (requires npm)' && echo '  pixi run test-js-browser    - JS tests in browser only' && echo '  pixi run test-js-node       - JS tests in Node.js only' && echo '  pixi run test-safe          - All Kotlin tests with compile fallback' && echo '  pixi run test-compile-check - Verify main code compiles' && echo '  pixi run test-code-check    - Verify test code compiles'"
description = "Print a summary of all available test tasks"

# ── Documentation ─────────────────────────────────────────────────────────────

[tasks.docs]
cmd = "gradle generateDocs"
description = "Generate project API documentation via Gradle"

[tasks.docs-setup]
cmd = "gem install asciidoctor asciidoctor-diagram asciidoctor-revealjs asciidoctor-pdf"
description = "Install Ruby gems required for AsciiDoc documentation rendering"

[tasks.docs-adoc]
cmd = "asciidoctor -r asciidoctor-diagram docs/roadmap.adoc -o build/docs/roadmap.html"
description = "Render docs/roadmap.adoc to HTML with diagram support"

[tasks.docs-pdf]
cmd = "asciidoctor-pdf -r asciidoctor-diagram docs/roadmap.adoc -o build/docs/roadmap.pdf"
description = "Render docs/roadmap.adoc to PDF with diagram support"

[tasks.docs-slides]
cmd = "asciidoctor-revealjs docs/roadmap.adoc -o build/docs/roadmap-slides.html"
description = "Render docs/roadmap.adoc as a reveal.js slide deck"

[tasks.docs-all]
cmd = "pixi run docs-adoc && pixi run docs-pdf && pixi run docs-slides"
description = "Render docs/roadmap.adoc in all formats: HTML, PDF, and reveal.js slides"

[tasks.docs-check]
cmd = "ruby -e \"puts 'Ruby version: ' + RUBY_VERSION; %w[asciidoctor asciidoctor-diagram asciidoctor-revealjs asciidoctor-pdf].each {|gem| begin; require gem; puts gem + ': available'; rescue LoadError; puts gem + ': not available'; end}\""
description = "Report Ruby version and whether each required asciidoctor gem is installed"

# ── Python ────────────────────────────────────────────────────────────────────

[tasks.python-native]
cmd = "gradle linkNative"
description = "Compile the Kotlin/Native target and link libtinkercat.so for Python ctypes use"

[tasks.python-setup]
cmd = "python -m pip install -e python/"
description = "Install the tinkercat Python package in editable/development mode"

[tasks.test-python]
cmd = "python -m pytest tests/python/ -v -n auto"
description = "Run the Python test suite in tests/python/ against the installed TinkerCat package"

[tasks.test-python-pkg]
cmd = "python -m pytest python/tests/ -v"
description = "Run the Python package integration tests in python/tests/"

[tasks.python-build-test]
cmd = "pixi run python-native && pixi run python-setup && pixi run test-python"
description = "Full Python pipeline: build native library, install package, run tests"

[tasks.python-dev]
cmd = "python -c \"from tinkercat import TinkerCat; print('TinkerCat Python bindings loaded successfully')\""
description = "Smoke-test the Python bindings by importing TinkerCat"

# ── Demonstrations ────────────────────────────────────────────────────────────

[tasks.runJvmDemo]
cmd = "gradle runJvmDemo"
description = "Run the JVM platform demo showcasing Java interop and enterprise features"

[tasks.runJsNodeDemo]
cmd = "gradle runJsNodeDemo"
description = "Run the JavaScript platform demo in a Node.js environment"

[tasks.runNativeDemo]
cmd = "gradle runNativeDemo"
description = "Run the Kotlin/Native platform demo showcasing native performance"

# ── Compliance ────────────────────────────────────────────────────────────────

# Options (passed after --):
#   --format html|json     alternative output format (default: AsciiDoc)
#   --download             pull fresh upstream tests before analysis
#   --output <file>        explicit output path
[tasks.compliance]
cmd = "nu pixi-scripts/compliance_deviation_analysis.nu"
description = "Analyze TinkerPop compliance deviations and write a report to build/reports/compliance/"

# ── Packaging ─────────────────────────────────────────────────────────────────

# Options (passed after --):
#   --output-dir <path>   override the output directory (default: build/conda-packages)
[tasks.package]
cmd = "nu pixi-scripts/package-build.nu"
description = "Build all conda packages defined in recipes/recipe.yaml using rattler-build"

# ── Version management ────────────────────────────────────────────────────────

[tasks.version-sync]
cmd = "nu pixi-scripts/version-sync.nu"
description = "Propagate the version from pixi.toml to recipes/recipe.yaml, build.gradle.kts, and python/tinkercat/__init__.py"

[tasks.version-bump]
cmd = "nu pixi-scripts/version-bump.nu"
description = "Increment the patch version in pixi.toml, then run version-sync"

# ── Dependencies ──────────────────────────────────────────────────────────────

[dependencies]
gradle = "9.*"
openjdk = "23.*"
kotlin = "2.3.*"
ruby = ">=4.0"
python = ">=3.14"
pip = ">=26"
hatchling = ">=1.29"
rattler-build = ">=0.65"
nushell = ">=0.109"
go-yq = ">=4"

[pypi-dependencies]
toml-cli = "*"
pytest-xdist = ">=3.8.0"
