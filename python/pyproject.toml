[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinkercat"
dynamic = ["version"]
description = "Python bindings for TinkerCat Kotlin multiplatform implementation"
license = {text = "Apache License 2.0"}
authors = [
    {name = "Apache TinkerPop", email = "dev@tinkerpop.apache.org"},
]
requires-python = ">=3.8"
keywords = ["graph", "database", "tinkerpop", "gremlin", "kotlin", "native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/apache/tinkerpop"
"Bug Tracker" = "https://github.com/apache/tinkerpop/issues"
Documentation = "https://tinkerpop.apache.org/docs/"
"Source Code" = "https://github.com/apache/tinkerpop"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "isort>=5.0",
    "mypy>=0.800",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]

[tool.hatch.version]
path = "tinkercat/__init__.py"
